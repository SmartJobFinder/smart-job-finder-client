name: Deploy Client to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_PROXY_TARGET=${{ secrets.NEXT_PUBLIC_API_PROXY_TARGET }} \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
            --build-arg NEXT_PUBLIC_WS_ENDPOINT=${{ secrets.NEXT_PUBLIC_WS_ENDPOINT }} \
            --build-arg NEXT_PUBLIC_SUB_DEST=${{ secrets.NEXT_PUBLIC_SUB_DEST }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            -t ${{ secrets.DOCKER_USERNAME }}/smart-job-finder-client:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smart-job-finder-client:latest

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: ~/smart-job-finder-client

      - name: Create .env file on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/smart-job-finder-client
            cat > ~/smart-job-finder-client/.env << EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            NEXT_PUBLIC_API_PROXY_TARGET=${{ secrets.NEXT_PUBLIC_API_PROXY_TARGET }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_ENDPOINT=${{ secrets.NEXT_PUBLIC_WS_ENDPOINT }}
            NEXT_PUBLIC_SUB_DEST=${{ secrets.NEXT_PUBLIC_SUB_DEST }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            EOF
            chmod 600 ~/smart-job-finder-client/.env

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/smart-job-finder-client

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest image
            docker-compose pull

            # Stop and remove old container
            docker-compose down

            # Start new container
            docker-compose up -d

            # Log deployment
            echo "Deployed at $(date)" >> ~/smart-job-finder-client/deployed.log

            # Show status
            docker-compose ps
