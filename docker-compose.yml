services:
  jobfind_fe:
    # Production: pull from Docker Hub
    image: ${DOCKER_USERNAME}/smart-job-finder-client:latest

    # For local development, uncomment build section:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_API_PROXY_TARGET: ${NEXT_PUBLIC_API_PROXY_TARGET}
    #     NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    #     NEXT_PUBLIC_WS_ENDPOINT: ${NEXT_PUBLIC_WS_ENDPOINT}
    #     NEXT_PUBLIC_SUB_DEST: ${NEXT_PUBLIC_SUB_DEST}
    #     NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

    container_name: jobfind_fe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_PROXY_TARGET=${NEXT_PUBLIC_API_PROXY_TARGET}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_WS_ENDPOINT=${NEXT_PUBLIC_WS_ENDPOINT}
      - NEXT_PUBLIC_SUB_DEST=${NEXT_PUBLIC_SUB_DEST}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    env_file:
      - .env
    networks:
      - jobfind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  jobfind-network:
    driver: bridge
